
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Financial Allocation</title>

    <link rel="stylesheet" href="financial.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>

<body>

<div class="topbar">

    <div class="left">

        <button class="logout-button" onclick="logout()">
            Logout
        </button>

        <button class="homepage-button" onclick="AccessedToPage('mainpage')">
            <img src="myhome.webp" title="Main Page">
        </button>

    </div>


    <div class="right">

        <div class="userinfo">

            <label>Section</label>

            <input id="section" disabled>

        </div>


        <img src="https://wssp.hcww.com.eg/public/static/media/wsp.22cd4e849308ae80b006.png"
             class="logo">

    </div>

</div>



<div class="page-container">

<br>
<br>
<h1>Financial Allocation</h1>



<div class="generalinfo">


<div>

<label class="infolabel">
Branch
</label>


<select id="branch">

<option value="" disabled selected>
Select Branch
</option>

<option value="العدوه">العدوه</option>
<option value="مغاغة">مغاغة</option>
<option value="بنى مزار">بنى مزار</option>
<option value="مطاى">مطاى</option>
<option value="سمالوط">سمالوط</option>
<option value="المنيا">المنيا</option>
<option value="ابوقرقاص">ابوقرقاص</option>
<option value="ملوى">ملوى</option>
<option value="ديرمواس">ديرمواس</option>

</select>


</div>




<div>

<label class="infolabel">
Station
</label>


<select id="station">

<option value="" disabled selected>
Select Station
</option>

</select>


</div>


</div>



<hr>



<div id="financialTableContainer">


<table class="ca-table">


<thead>

<tr>

<th>الموقع</th>
<th>الخطر</th>
<th>الإجراء التصحيحي</th>
<th>القيمة التقديرية</th>
<th>مصدر التمويل</th>
<th>القيمة المنصرفة الفعلية</th>
<th>ملاحظات</th>
<th></th>


</tr>


</thead>



<tbody id="financialTableBody">


</tbody>



</table>


</div>


</div>





<script>


const scriptURL = "https://script.google.com/macros/s/AKfycbwHHN25xVZ3dux-_Yxkts1CQW081QhNYLbfdN5WQi2YjEyqbMpXHvwOHnGtK2AudPVXTw/exec";



let department = "";
let email = "";
let currentStation = "";



window.onload = function(){


email = sessionStorage.getItem("email");
department = sessionStorage.getItem("department");
document.getElementById("section").value = department || "";

loadStations(department);


document.getElementById("branch").addEventListener("change",function(){
loadStations(this.value);
});
};






function loadStations(branch){


let station =
document.getElementById("station");
station.innerHTML=
`
<option>
Loading...
</option>
`;



fetch(
scriptURL+
"?action=getStations&branch="+
encodeURIComponent(branch)

)


.then(r=>r.json())


.then(data=>{


station.innerHTML=
`
<option value="">
Select Station
</option>
`;



data.stations.forEach(s=>{


let op=document.createElement("option");

op.value=s;

op.textContent=s;


station.appendChild(op);



});


});



}







document.getElementById("station")
.addEventListener("change",function(){


currentStation=this.value;


loadFinancialData(this.value);


});









function loadFinancialData(station){

fetch(
scriptURL+
"?action=getStationDetails&station="+
encodeURIComponent(station)

)


.then(r=>r.json())


.then(data=>{


createFinancialTable(data.details);



});



}









function createFinancialTable(details){
      
const branch = document.getElementById("branch").value;
let tbody =
document.getElementById("financialTableBody");
tbody.innerHTML = "";
const fragment = document.createDocumentFragment();
details.forEach(row=>{



// إظهار الصف إذا كانت الجهة المنفذة تحتوي على:
// الفرع أو التشغيل والصيانة - جنوب أو المشروعات أو التخطيط
const allowedExecutors = [
    branch,
    "التشغيل والصيانة - جنوب",
    "المشروعات",
    "التخطيط"
];

if (!allowedExecutors.some(executor => String(row.executor || "").includes(executor))){
    return;
}
// إخفاء الإجراءات غير المعتمدة عن التخطيط
if(department === "التخطيط" && row.checkbox !== true){
    return;
}


let tr=document.createElement("tr");

tr.dataset.canUndoProjects = "false";
tr.dataset.canUndoPlanning = "false";
tr.dataset.location=row.location;
tr.dataset.risk=row.risk;
tr.dataset.coraction=row.corraction;    
tr.previousProjects = {
    aproximatevalue: row.aproximatevalue ?? "",
    resources: row.resources || ""
};

tr.previousPlanning = {
    expensedvalue: row.expensedvalue ?? "",
    remarks: row.remarks || ""
};


let approxDisabled="";
let expenseDisabled="";
let remarksDisabled="";
let resourcesDisabled="";
const hasApproximate =
    row.aproximatevalue !== null &&
    row.aproximatevalue !== undefined &&
    String(row.aproximatevalue).trim() !== "";
const hasExpense =
    row.expensedvalue !== null &&
    row.expensedvalue !== undefined &&
    String(row.expensedvalue).trim() !== "";
const hasRemarks =
    row.remarks !== null &&
    row.remarks !== undefined &&
    String(row.remarks).trim() !== "";
const hasResources =
    row.resources !== null &&
    row.resources !== undefined &&
    String(row.resources).trim() !== "";    

let saveDisabled = false;
let undoDisabled = true;


// بيانات موجودة مسبقاً من قاعدة البيانات
let hasPreviousProjects = hasApproximate || hasResources;
let hasPreviousPlanning = hasExpense || hasRemarks;


// حالة وجود حفظ جديد
let canUndoProjects = tr.dataset.canUndoProjects === "true";
let canUndoPlanning = tr.dataset.canUndoPlanning === "true";


if(department === "المشروعات"){

    undoDisabled = !(hasPreviousProjects || canUndoProjects);

}

else if(department === "التخطيط"){

    undoDisabled = !(hasPreviousPlanning || canUndoPlanning);

}

else if(department === "WSP"){

    undoDisabled = !(
        hasPreviousProjects ||
        hasPreviousPlanning ||
        canUndoProjects ||
        canUndoPlanning
    );

}

if (department === "WSP") {

    if (hasApproximate && !hasExpense) {

        // المشروعات انتهت
        approxDisabled = "disabled";
        resourcesDisabled = "disabled";

        // التخطيط مازال يعمل
        expenseDisabled = "";
        remarksDisabled = "";

        saveDisabled = false;
        undoDisabled = false;
    }

    else if (!hasApproximate && hasExpense) {

        approxDisabled = "";
        resourcesDisabled = "";

        expenseDisabled = "disabled";
        remarksDisabled = "disabled";

        saveDisabled = false;
        undoDisabled = false;
    }

    else if (hasApproximate && hasExpense) {

        approxDisabled = "disabled";
        resourcesDisabled = "disabled";
        expenseDisabled = "disabled";
        remarksDisabled = "disabled";

        saveDisabled = true;
        undoDisabled = false;
    }

    else {

        saveDisabled = false;
        undoDisabled = true;
    }

}
else {

    let hasChanges = false;

    if (department === "المشروعات")
        hasChanges = hasApproximate || hasResources;

    if (department === "التخطيط")
        hasChanges = hasExpense || hasRemarks;

    saveDisabled = hasChanges;
    undoDisabled = !hasChanges;
}
    

// صلاحيات قسم التخطيط
if(department === "التخطيط"){

    approxDisabled = "disabled";
    resourcesDisabled = "disabled";

}


// صلاحيات قسم المشروعات
if(department === "المشروعات"){

    expenseDisabled = "disabled";
    remarksDisabled = "disabled";

}


// إذا كان هناك قيمة منصرفة فعلية
if (department !== "WSP") {

    if (hasExpense) {
        tr.classList.add("locked-row");
        expenseDisabled = "disabled";
        remarksDisabled = "disabled";
    }

    if (hasApproximate) {
        tr.classList.add("locked-row");
        approxDisabled = "disabled";
        resourcesDisabled = "disabled";
    }

}
    

if(department === "المشروعات" && (hasApproximate || hasResources)){
    expenseDisabled = "disabled";
    remarksDisabled = "disabled";
}

else if(department==="التخطيط" && (hasExpense || hasRemarks)){
    approxDisabled = "disabled";
    resourcesDisabled = "disabled";
}



tr.innerHTML=`

<td class="locked-field">${row.location}</td>
<td class="locked-field">${row.risk}</td>
<td class="locked-field">${row.corraction}</td>

<td>
    <input type="number" class="approximate" value="${row.aproximatevalue ?? ""}" ${approxDisabled}>
</td>
<td>
    <textarea class="resources" ${resourcesDisabled}>${row.resources || ""}</textarea>
</td>

<td>
    <input type="number" class="expense" value="${row.expensedvalue ?? ""}" ${expenseDisabled}>
</td>



<td>
    <textarea class="remarks" ${remarksDisabled}>${row.remarks || ""}</textarea>
</td>



<td class="action-cell">
    <div class="action-buttons">
        <button class="icon-btn save-btn" onclick="saveFinancial(this)" title="Save" ${saveDisabled ? "disabled" : ""}>
            <i class="fa-solid fa-floppy-disk"></i>
        </button>
        
        <button class="icon-btn undo-btn" onclick="undoFinancial(this)" title="Undo" ${undoDisabled ? "" : "disabled"}>
            <i class="fa-solid fa-rotate-left"></i>
        </button>
    </div>
</td>



`;

fragment.appendChild(tr);
updateRowState(tr);

});
tbody.appendChild(fragment);
}

function updateRowState(row, selectedDepartment = null){

    const approximate = row.querySelector(".approximate");
    const resources = row.querySelector(".resources");
    const expense = row.querySelector(".expense");
    const remarks = row.querySelector(".remarks");
    const saveBtn = row.querySelector(".save-btn");
    const undoBtn = row.querySelector(".undo-btn");
    const hasApprox =
        row.querySelector(".approximate").value.trim() !== "" ||
        row.querySelector(".resources").value.trim() !== "";

    const hasExpense =
        row.querySelector(".expense").value.trim() !== "" ||
        row.querySelector(".remarks").value.trim() !== "";


   const canUndoProjects = row.dataset.canUndoProjects === "true" ||
    (department === "المشروعات" &&
        (row.querySelector(".approximate").value.trim() !== "" ||  row.querySelector(".resources").value.trim() !== "")
    );


   const canUndoPlanning = row.dataset.canUndoPlanning === "true" ||
    (department === "التخطيط" &&
        (row.querySelector(".expense").value.trim() !== "" || row.querySelector(".remarks").value.trim() !== "")
    );


    if(department === "WSP"){

        if(hasApprox && !hasExpense){

            approximate.disabled = true;
            resources.disabled = true;

            expense.disabled = false;
            remarks.disabled = false;
        }

        else if(!hasApprox && hasExpense){

            approximate.disabled = false;
            resources.disabled = false;

            expense.disabled = true;
            remarks.disabled = true;
        }

        else if(hasApprox && hasExpense){

            approximate.disabled = true;
            resources.disabled = true;

            expense.disabled = true;
            remarks.disabled = true;
        }


        saveBtn.disabled = false;

        undoBtn.disabled =
            !(canUndoProjects || canUndoPlanning);
    }


    else if(department === "المشروعات"){

       expense.disabled = true;
       remarks.disabled = true;


        if(hasApprox){

            approximate.disabled = true;
            resources.disabled = true;

        }
        else{

            approximate.disabled = false;
            resources.disabled = false;

        }


        saveBtn.disabled = hasApprox;

        // Undo يعمل فقط إذا:
        // 1- توجد بيانات قديمة
        // أو
        // 2- تم حفظ بيانات جديدة
        undoBtn.disabled =
            !(canUndoProjects);
    }


    else if(department === "التخطيط"){

        approximate.disabled = true;
        resources.disabled = true;


        if(hasExpense){

           expense.disabled = true;
           remarks.disabled = true;
        }
        else{

            expense.disabled = false;
            remarks.disabled = false;
        }

        saveBtn.disabled = hasExpense;


        // Undo يعمل فقط إذا:
        // 1- توجد بيانات قديمة
        // أو
        // 2- تم حفظ بيانات جديدة
        undoBtn.disabled =
            !(canUndoPlanning);
    }
}
    
async function saveFinancial(btn) {
    let row = btn.closest("tr");
    const selectedDepartment = await chooseSection();
    if (selectedDepartment === null) {
        return;
    }
    if (department === "WSP") {

        if (selectedDepartment === "المشروعات") {
            row.querySelector(".approximate").disabled = false;
            row.querySelector(".resources").disabled = false;
            row.querySelector(".expense").disabled = true;
            row.querySelector(".remarks").disabled = true;
        } else {
            row.querySelector(".approximate").disabled = true;
            row.querySelector(".resources").disabled = true;
            row.querySelector(".expense").disabled = false;
            row.querySelector(".remarks").disabled = false;
        }
    }
    

  
    let oldProjects = row.previousProjects;
    let oldPlanning = row.previousPlanning;
   


    let data = new URLSearchParams();

    data.append("action", "financialStationDetails");
    data.append("station", currentStation);
    data.append("location", row.dataset.location);
    data.append("risk", row.dataset.risk);
    if(selectedDepartment === "المشروعات"){
        data.append("aproximatevalue", row.querySelector(".approximate").value);
        data.append("resources", row.querySelector(".resources").value);
        data.append("expensedvalue", oldPlanning.expensedvalue);
        data.append("remarks", oldPlanning.remarks);
    }else{
        data.append("aproximatevalue", oldProjects.aproximatevalue);
        data.append("resources", oldProjects.resources);
        data.append("expensedvalue", row.querySelector(".expense").value);
        data.append("remarks", row.querySelector(".remarks").value);
    }
    data.append("email", email);
    data.append("department", selectedDepartment);
    fetch(scriptURL, {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: data.toString()
    })
    .then(r => r.json())
    .then(result => {

        if(result.result === "Updated"){
            if(selectedDepartment === "المشروعات"){
                row.dataset.canUndoProjects = "true";
            
            }else if(selectedDepartment === "التخطيط"){            
                row.dataset.canUndoPlanning = "true";            
            }
            
            // حفظ البيانات الحالية قبل الإرسال
           if (selectedDepartment === "المشروعات") {
    
                row.dataset.previousProjects = JSON.stringify({
                    aproximatevalue: row.querySelector(".approximate").value,
                    resources: row.querySelector(".resources").value
                });
            
            } else {
            
                row.dataset.previousPlanning = JSON.stringify({
                    expensedvalue: row.querySelector(".expense").value,
                    remarks: row.querySelector(".remarks").value
                });
            
            }

            // تحديث القيم القديمة بعد نجاح الحفظ
            row.dataset.oldApproximate = row.querySelector(".approximate").value;
            row.dataset.oldResources = row.querySelector(".resources").value;
            row.dataset.oldExpense = row.querySelector(".expense").value;
            row.dataset.oldRemarks = row.querySelector(".remarks").value;
            // تعطيل جميع المدخلات في الصف
            updateRowState(row, selectedDepartment);
            row.querySelector(".save-btn").disabled = true;

            if(selectedDepartment === "المشروعات"){
                row.dataset.canUndoProjects = "true";
            }
            
            if(selectedDepartment === "التخطيط"){
                row.dataset.canUndoPlanning = "true";
            }
            
            updateRowState(row, selectedDepartment);

            alert("تم حفظ البيانات بنجاح");
        } else {
            alert("حدث خطأ أثناء الحفظ");
        }
    });
}
    
async function undoFinancial(btn){

    let row = btn.closest("tr");

    const selectedDepartment = await chooseSection();

    if (selectedDepartment === null) {
        return;
    }


    if(selectedDepartment === "المشروعات" && !row.dataset.previousProjects){

        alert("لا يوجد تعديل سابق للمشروعات");
        return;
    }


    if(selectedDepartment === "التخطيط" && !row.dataset.previousPlanning){

        alert("لا يوجد تعديل سابق للتخطيط");
        return;
    }



    let oldProjects = row.previousProjects;
    let oldPlanning = row.previousPlanning;



    // إعادة آخر بيانات محفوظة في الشاشة فقط
    if(selectedDepartment === "المشروعات"){

        row.querySelector(".approximate").value =
            oldProjects.aproximatevalue;

        row.querySelector(".resources").value =
            oldProjects.resources;


        // فتح جزء المشروعات للتعديل
        row.querySelector(".approximate").disabled = false;
        row.querySelector(".resources").disabled = false;


        // إغلاق جزء التخطيط
        row.querySelector(".expense").disabled = true;
        row.querySelector(".remarks").disabled = true;


    }
    else if(selectedDepartment === "التخطيط"){


        row.querySelector(".expense").value =
            oldPlanning.expensedvalue;

        row.querySelector(".remarks").value =
            oldPlanning.remarks;



        // فتح جزء التخطيط للتعديل
        row.querySelector(".expense").disabled = false;
        row.querySelector(".remarks").disabled = false;


        // إغلاق جزء المشروعات
        row.querySelector(".approximate").disabled = true;
        row.querySelector(".resources").disabled = true;

    }



    // إزالة حالة القفل المرئي
    row.classList.remove("locked-row");

    row.querySelectorAll(".locked-field").forEach(cell=>{

        cell.classList.remove("locked-row");

    });

    row.querySelector(".save-btn").disabled = false;


    // بعد التراجع لا يوجد حفظ سابق
   if(selectedDepartment === "المشروعات"){

        row.dataset.canUndoProjects = "false";
    
    }
    
    else if(selectedDepartment === "التخطيط"){
    
        row.dataset.canUndoPlanning = "false";
    
    }
    
    
    row.querySelector(".undo-btn").disabled = true;

    alert("تم الرجوع للتعديل");

}
//////اختيار جهه الحفظ والتعديل ل WSP //////
async function chooseSection() {

    if (department !== "WSP") {
        return department;
    }

    let choice = prompt(
    `اختر الجزء المطلوب:
    
    1 - المشروعات
   
    2 - التخطيط
        
    0 - إلغاء`
    );

    switch (choice) {
        case "1":
            return "المشروعات";

        case "2":
            return "التخطيط";

        default:
            return null;
    }
}    

function logout(){
    sessionStorage.clear();
    window.location.href="index.html";
}



function AccessedToPage(pagename){
    window.location.href=pagename+".html";
}



</script>


</body>

</html>

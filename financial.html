
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Financial Allocation</title>

    <link rel="stylesheet" href="financial.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


</head>

<body>

<div class="topbar">

    <div class="left">

        <button class="logout-button" onclick="logout()">
            Logout
        </button>

        <button class="homepage-button" onclick="AccessedToPage('mainpage')">
            <img src="myhome.webp" title="Main Page">
        </button>

    </div>


    <div class="right">

        <div class="userinfo">

            <label>Section</label>

            <input id="section" disabled>

        </div>


        <img src="https://wssp.hcww.com.eg/public/static/media/wsp.22cd4e849308ae80b006.png"
             class="logo">

    </div>

</div>



<div class="page-container">

<br>
<br>
<h1>Financial Allocation</h1>



<div class="generalinfo">


<div>

<label class="infolabel">
Branch
</label>


<select id="branch">

<option value="" disabled selected>
Select Branch
</option>

<option value="العدوه">العدوه</option>
<option value="مغاغة">مغاغة</option>
<option value="بنى مزار">بنى مزار</option>
<option value="مطاى">مطاى</option>
<option value="سمالوط">سمالوط</option>
<option value="المنيا">المنيا</option>
<option value="ابوقرقاص">ابوقرقاص</option>
<option value="ملوى">ملوى</option>
<option value="ديرمواس">ديرمواس</option>

</select>


</div>




<div>

<label class="infolabel">
Station
</label>


<select id="station">

<option value="" disabled selected>
Select Station
</option>

</select>


</div>


</div>



<hr>



<div id="financialTableContainer">


<table class="ca-table">


<thead>

<tr>

<th>الموقع</th>
<th>الخطر</th>
<th>الإجراء التصحيحي</th>
<th>القيمة التقديرية</th>
<th>مصدر التمويل</th>
<th>القيمة المنصرفة الفعلية</th>
<th>ملاحظات</th>
<th></th>


</tr>


</thead>



<tbody id="financialTableBody">


</tbody>



</table>


</div>


</div>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbw5xVJ-dAUJFC0lLb5tJLfNPpDt0dAHljxE0vQfBjTi-57t6sINRKntUw2MFLpL6ebc1g/exec";

let department = "";
let email = "";
let currentStation = "";

window.onload = function(){

    email = sessionStorage.getItem("email");
    department = sessionStorage.getItem("department");

    document.getElementById("section").value = department || "";

    loadStations(department);

    document.getElementById("branch").addEventListener("change", function(){
        loadStations(this.value);
    });

};

function loadStations(branch){

    fetch(
        scriptURL +
        "?action=getStations&branch=" +
        encodeURIComponent(branch)
    )
    .then(r => r.json())
    .then(data => {

        let station = document.getElementById("station");

        station.innerHTML = '<option value="">Select Station</option>';

        data.stations.forEach(s => {

            let op = document.createElement("option");

            op.value = s;
            op.textContent = s;

            station.appendChild(op);

        });

    });

}


document.getElementById("station")
.addEventListener("change", function(){

    currentStation = this.value;

    loadFinancialData(this.value);

});


async function loadFinancialData(station){

    try {
        const response = await fetch(
            scriptURL +
            "?action=getStationDetails&station=" +
            encodeURIComponent(station)
        );

        const data = await response.json();

        createFinancialTable(data.details);

    } catch(error) {

        console.error(error);

        alert("حدث خطأ أثناء تحميل البيانات");

    }

}



/*
========================================================
اختيار القسم الذي سيعمل WSP من خلاله
========================================================
*/

async function chooseSection(){

    // المستخدم العادي
    if(department !== "WSP"){
        return department;
    }

    // مستخدم WSP
    const choice = prompt(
`اختر الجزء المطلوب:

1 - المشروعات

2 - التخطيط

0 - إلغاء`
    );

    switch(choice){

        case "1":
            return "المشروعات";

        case "2":
            return "التخطيط";

        default:
            return null;
    }

}


/*
========================================================
إنشاء الجدول
========================================================
*/

function createFinancialTable(details){

    const branch = document.getElementById("branch").value;

    let tbody =
        document.getElementById("financialTableBody");

    tbody.innerHTML = "";

    const fragment =
        document.createDocumentFragment();


    details.forEach(row => {


        /*
        --------------------------------------------
        تحديد الجهات المسموح ظهورها
        --------------------------------------------
        */

        const allowedExecutors = [
            branch,
            "التشغيل والصيانة - جنوب",
            "المشروعات",
            "التخطيط"
        ];


        if(
            !allowedExecutors.some(
                executor =>
                String(row.executor || "")
                .includes(executor)
            )
        ){
            return;
        }


        /*
        --------------------------------------------
        التخطيط يرى فقط الإجراءات المعتمدة
        --------------------------------------------
        */

        if(
            department === "التخطيط" &&
            row.checkbox !== true
        ){
            return;
        }


        let tr = document.createElement("tr");


        /*
        --------------------------------------------
        حفظ البيانات السابقة
        --------------------------------------------
        */

        tr.dataset.canUndoProjects = "false";
        tr.dataset.canUndoPlanning = "false";

        tr.dataset.location = row.location;
        tr.dataset.risk = row.risk;
        tr.dataset.coraction = row.corraction;


        tr.previousProjects = {

            aproximatevalue:
                row.aproximatevalue ?? "",

            resources:
                row.resources || ""

        };


        tr.previousPlanning = {

            expensedvalue:
                row.expensedvalue ?? "",

            remarks:
                row.remarks || ""

        };


        /*
        --------------------------------------------
        هل توجد بيانات؟
        --------------------------------------------
        */

        const hasApproximate =
            row.aproximatevalue !== null &&
            row.aproximatevalue !== undefined &&
            String(row.aproximatevalue).trim() !== "";


        const hasExpense =
            row.expensedvalue !== null &&
            row.expensedvalue !== undefined &&
            String(row.expensedvalue).trim() !== "";


        const hasRemarks =
            row.remarks !== null &&
            row.remarks !== undefined &&
            String(row.remarks).trim() !== "";


        const hasResources =
            row.resources !== null &&
            row.resources !== undefined &&
            String(row.resources).trim() !== "";


        const hasPreviousProjects =
            hasApproximate || hasResources;


        const hasPreviousPlanning =
            hasExpense || hasRemarks;


        /*
        --------------------------------------------
        الحالات الابتدائية
        --------------------------------------------
        */

        let approxDisabled = "";
        let expenseDisabled = "";
        let remarksDisabled = "";
        let resourcesDisabled = "";

        let saveDisabled = false;
        let undoDisabled = true;


        /*
        ============================================
        المستخدم WSP
        ============================================
        */

        if(department === "WSP"){

            /*
            ----------------------------------------
            لو المشروع موجود والتخطيط غير موجود
            ----------------------------------------
            */

            if(hasApproximate && !hasExpense){

                approxDisabled = "disabled";
                resourcesDisabled = "disabled";

                expenseDisabled = "";
                remarksDisabled = "";

                saveDisabled = false;
                undoDisabled = false;

            }


            /*
            ----------------------------------------
            لو التخطيط موجود والمشروع غير موجود
            ----------------------------------------
            */

            else if(!hasApproximate && hasExpense){

                approxDisabled = "";
                resourcesDisabled = "";

                expenseDisabled = "disabled";
                remarksDisabled = "disabled";

                saveDisabled = false;
                undoDisabled = false;

            }


            /*
            ----------------------------------------
            الاثنين موجودين
            ----------------------------------------
            */

            else if(hasApproximate && hasExpense){

                approxDisabled = "disabled";
                resourcesDisabled = "disabled";

                expenseDisabled = "disabled";
                remarksDisabled = "disabled";

                saveDisabled = true;
                undoDisabled = false;

            }


            /*
            ----------------------------------------
            لا توجد بيانات
            ----------------------------------------
            */

            else{

                saveDisabled = false;
                undoDisabled = true;

            }

        }


        /*
        ============================================
        مستخدم المشروعات
        ============================================
        */

        else if(department === "المشروعات"){

            expenseDisabled = "disabled";
            remarksDisabled = "disabled";


            if(hasPreviousProjects){

                approxDisabled = "disabled";
                resourcesDisabled = "disabled";

                saveDisabled = true;
                undoDisabled = true;

            }

        }


        /*
        ============================================
        مستخدم التخطيط
        ============================================
        */

        else if(department === "التخطيط"){

            approxDisabled = "disabled";
            resourcesDisabled = "disabled";


            if(hasPreviousPlanning){

                expenseDisabled = "disabled";
                remarksDisabled = "disabled";

                saveDisabled = true;
                undoDisabled = true;

            }

        }


        /*
        ============================================
        البيانات الموجودة تقفل الصف
        ============================================
        */

        if(department !== "WSP"){

            if(hasExpense){

                tr.classList.add("locked-row");

                expenseDisabled = "disabled";
                remarksDisabled = "disabled";

            }


            if(hasApproximate){

                tr.classList.add("locked-row");

                approxDisabled = "disabled";
                resourcesDisabled = "disabled";

            }

        }


        /*
        ============================================
        HTML الخاص بالصف
        ============================================
        */

        tr.innerHTML = `

<td class="locked-field">
    ${row.location}
</td>

<td class="locked-field">
    ${row.risk}
</td>

<td class="locked-field">
    ${row.corraction}
</td>

<td>

    <input
        type="number"
        class="approximate"
        value="${row.aproximatevalue ?? ""}"
        ${approxDisabled}
    >

</td>

<td>

    <textarea
        class="resources"
        ${resourcesDisabled}
    >${row.resources || ""}</textarea>

</td>

<td>

    <input
        type="number"
        class="expense"
        value="${row.expensedvalue ?? ""}"
        ${expenseDisabled}
    >

</td>

<td>

    <textarea
        class="remarks"
        ${remarksDisabled}
    >${row.remarks || ""}</textarea>

</td>

<td class="action-cell">

    <div class="action-buttons">

        <button
            class="icon-btn save-btn"
            onclick="saveFinancial(this)"
            title="Save"
            ${saveDisabled ? "disabled" : ""}
        >
            <i class="fa-solid fa-floppy-disk"></i>
        </button>

        <button
            class="icon-btn undo-btn"
            onclick="undoFinancial(this)"
            title="Undo"
            ${undoDisabled ? "disabled" : ""}
        >
            <i class="fa-solid fa-rotate-left"></i>
        </button>

    </div>

</td>

`;


        fragment.appendChild(tr);

    });


    tbody.appendChild(fragment);

}


/*
========================================================
تحديث حالة الصف
========================================================
*/

function updateRowState(row, selectedDepartment){

    const approximate =
        row.querySelector(".approximate");

    const resources =
        row.querySelector(".resources");

    const expense =
        row.querySelector(".expense");

    const remarks =
        row.querySelector(".remarks");

    const saveBtn =
        row.querySelector(".save-btn");

    const undoBtn =
        row.querySelector(".undo-btn");


    const hasApprox =
        approximate.value.trim() !== "" ||
        resources.value.trim() !== "";


    const hasExpense =
        expense.value.trim() !== "" ||
        remarks.value.trim() !== "";


    /*
    ============================================
    WSP
    ============================================
    */

    if(department === "WSP"){

        /*
        WSP يعمل الآن كمشروعات
        */

        if(selectedDepartment === "المشروعات"){

            approximate.disabled = false;
            resources.disabled = false;

            expense.disabled = true;
            remarks.disabled = true;

            saveBtn.disabled = hasApprox;

            undoBtn.disabled =
                row.dataset.canUndoProjects !== "true";

        }


        /*
        WSP يعمل الآن كتخطيط
        */

        else if(selectedDepartment === "التخطيط"){

            approximate.disabled = true;
            resources.disabled = true;

            expense.disabled = false;
            remarks.disabled = false;

            saveBtn.disabled = hasExpense;

            undoBtn.disabled =
                row.dataset.canUndoPlanning !== "true";

        }

        return;
    }


    /*
    ============================================
    المشروعات
    ============================================
    */

    if(department === "المشروعات"){

        expense.disabled = true;
        remarks.disabled = true;


        if(hasApprox){

            approximate.disabled = true;
            resources.disabled = true;

        }
        else{

            approximate.disabled = false;
            resources.disabled = false;

        }


        saveBtn.disabled = hasApprox;


        undoBtn.disabled =
            row.dataset.canUndoProjects !== "true";

    }


    /*
    ============================================
    التخطيط
    ============================================
    */

    else if(department === "التخطيط"){

        approximate.disabled = true;
        resources.disabled = true;


        if(hasExpense){

            expense.disabled = true;
            remarks.disabled = true;

        }
        else{

            expense.disabled = false;
            remarks.disabled = false;

        }


        saveBtn.disabled = hasExpense;


        undoBtn.disabled =
            row.dataset.canUndoPlanning !== "true";

    }

}


/*
========================================================
الحفظ
========================================================
*/

async function saveFinancial(btn){

    const row = btn.closest("tr");


    /*
    --------------------------------------------
    تحديد القسم الذي ستتم عملية الحفظ باسمه
    --------------------------------------------
    */

    const selectedDepartment =
        await chooseSection();


    if(selectedDepartment === null){

        return;

    }


    /*
    --------------------------------------------
    البيانات القديمة
    --------------------------------------------
    */

    const oldProjects =
        row.previousProjects;

    const oldPlanning =
        row.previousPlanning;


    /*
    --------------------------------------------
    تجهيز البيانات
    --------------------------------------------
    */

    let data =
        new URLSearchParams();


    data.append(
        "action",
        "financialStationDetails"
    );


    data.append(
        "station",
        currentStation
    );


    data.append(
        "location",
        row.dataset.location
    );


    data.append(
        "risk",
        row.dataset.risk
    );


    /*
    ============================================
    الحفظ كمشروعات
    ============================================
    */

    if(selectedDepartment === "المشروعات"){

        data.append(
            "aproximatevalue",
            row.querySelector(".approximate").value
        );


        data.append(
            "resources",
            row.querySelector(".resources").value
        );


        /*
        نحافظ على بيانات التخطيط القديمة
        */

        data.append(
            "expensedvalue",
            oldPlanning.expensedvalue
        );


        data.append(
            "remarks",
            oldPlanning.remarks
        );

    }


    /*
    ============================================
    الحفظ كتخطيط
    ============================================
    */

    else if(selectedDepartment === "التخطيط"){

        /*
        نحافظ على بيانات المشروعات القديمة
        */

        data.append(
            "aproximatevalue",
            oldProjects.aproximatevalue
        );


        data.append(
            "resources",
            oldProjects.resources
        );


        data.append(
            "expensedvalue",
            row.querySelector(".expense").value
        );


        data.append(
            "remarks",
            row.querySelector(".remarks").value
        );

    }


    /*
    --------------------------------------------
    البيانات المشتركة
    --------------------------------------------
    */

    data.append(
        "email",
        email
    );


    /*
    مهم جدًا:
    هنا لا نرسل WSP
    وإنما القسم الذي اختاره WSP
    */

    data.append(
        "department",
        selectedDepartment
    );


    /*
    --------------------------------------------
    إرسال البيانات إلى GS
    --------------------------------------------
    */

    try{

        const response =
            await fetch(
                scriptURL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: data.toString()
                }
            );


        const result =
            await response.json();


        if(result.result !== "Updated"){

            alert("حدث خطأ أثناء الحفظ");

            return;

        }


        /*
        ========================================
        تحديث بيانات المشروعات
        ========================================
        */

        if(selectedDepartment === "المشروعات"){

            row.previousProjects = {

                aproximatevalue:
                    row.querySelector(".approximate").value,

                resources:
                    row.querySelector(".resources").value

            };


            row.dataset.canUndoProjects = "true";

        }


        /*
        ========================================
        تحديث بيانات التخطيط
        ========================================
        */

        else if(selectedDepartment === "التخطيط"){

            row.previousPlanning = {

                expensedvalue:
                    row.querySelector(".expense").value,

                remarks:
                    row.querySelector(".remarks").value

            };


            row.dataset.canUndoPlanning = "true";

        }


        /*
        --------------------------------------------
        تحديث حالة الصف
        --------------------------------------------
        */

        updateRowState(
            row,
            selectedDepartment
        );


        alert("تم حفظ البيانات بنجاح");
        await loadFinancialData(currentStation);



    }

    catch(error){

        console.error(error);

        alert("حدث خطأ أثناء الحفظ");

    }

}


/*
========================================================
التعديل / Undo
========================================================
*/

async function undoFinancial(btn){

    const row = btn.closest("tr");


    /*
    --------------------------------------------
    تحديد القسم
    --------------------------------------------
    */

    const selectedDepartment =
        await chooseSection();


    if(selectedDepartment === null){

        return;

    }


    /*
    ============================================
    WSP اختار المشروعات
    ============================================
    */

    if(selectedDepartment === "المشروعات"){

        if(!row.previousProjects){

            alert(
                "لا يوجد تعديل سابق للمشروعات"
            );

            return;

        }


        /*
        إعادة آخر بيانات المشروعات
        */

        row.querySelector(".approximate").value =
            row.previousProjects.aproximatevalue;


        row.querySelector(".resources").value =
            row.previousProjects.resources;


        /*
        فتح المشروعات
        */

        row.querySelector(".approximate").disabled =
            false;

        row.querySelector(".resources").disabled =
            false;


        /*
        إغلاق التخطيط
        */

        row.querySelector(".expense").disabled =
            true;

        row.querySelector(".remarks").disabled =
            true;


        /*
        أصبح الصف قابلًا للتعديل مرة أخرى
        */

        row.dataset.canUndoProjects =
            "false";


        row.querySelector(".save-btn").disabled =
            false;


        row.querySelector(".undo-btn").disabled =
            true;


        row.classList.remove("locked-row");

    }


    /*
    ============================================
    WSP اختار التخطيط
    ============================================
    */

    else if(selectedDepartment === "التخطيط"){

        if(!row.previousPlanning){

            alert(
                "لا يوجد تعديل سابق للتخطيط"
            );

            return;

        }


        /*
        إعادة آخر بيانات التخطيط
        */

        row.querySelector(".expense").value =
            row.previousPlanning.expensedvalue;


        row.querySelector(".remarks").value =
            row.previousPlanning.remarks;


        /*
        فتح التخطيط
        */

        row.querySelector(".expense").disabled =
            false;

        row.querySelector(".remarks").disabled =
            false;


        /*
        إغلاق المشروعات
        */

        row.querySelector(".approximate").disabled =
            true;

        row.querySelector(".resources").disabled =
            true;


        /*
        أصبح الصف قابلًا للتعديل مرة أخرى
        */

        row.dataset.canUndoPlanning =
            "false";


        row.querySelector(".save-btn").disabled =
            false;


        row.querySelector(".undo-btn").disabled =
            true;


        row.classList.remove("locked-row");

    }


    /*
    ============================================
    مستخدم المشروعات العادي
    ============================================
    */

    else if(
        department === "المشروعات" &&
        selectedDepartment === "المشروعات"
    ){

        row.querySelector(".approximate").disabled =
            false;

        row.querySelector(".resources").disabled =
            false;

        row.querySelector(".expense").disabled =
            true;

        row.querySelector(".remarks").disabled =
            true;

    }


    /*
    ============================================
    مستخدم التخطيط العادي
    ============================================
    */

    else if(
        department === "التخطيط" &&
        selectedDepartment === "التخطيط"
    ){

        row.querySelector(".approximate").disabled =
            true;

        row.querySelector(".resources").disabled =
            true;

        row.querySelector(".expense").disabled =
            false;

        row.querySelector(".remarks").disabled =
            false;

    }


    alert("تم الرجوع للتعديل");

}


/*
========================================================
Logout
========================================================
*/

function logout(){

    sessionStorage.clear();

    window.location.href =
        "index.html";

}


/*
========================================================
الصفحة الرئيسية
========================================================
*/

function AccessedToPage(pagename){

    window.location.href =
        pagename + ".html";

}

</script>

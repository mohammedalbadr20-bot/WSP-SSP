<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Financial Report</title>

<link rel="stylesheet" href="financial.css">

<style>

.report-filter{
    display:flex;
    gap:20px;
    align-items:end;
    margin:20px;
    flex-wrap:wrap;
}


.report-filter div{
    display:flex;
    flex-direction:column;
}


.report-filter input,
.report-filter select,
.report-filter button{
    padding:8px;
    font-size:16px;
}


.dashboard{
    display:flex;
    gap:20px;
    justify-content:center;
    margin:30px;
}


.card{

    width:220px;
    background:#f3f6fa;
    border-radius:12px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 8px #ccc;

}


.card h3{
    margin:0;
    color:#555;
}


.card span{

    display:block;
    font-size:28px;
    font-weight:bold;
    margin-top:15px;
    color:#0066cc;

}



.report-buttons{

    text-align:center;
    margin:20px;

}


.report-buttons button{

    padding:10px 25px;
    margin:5px;
    cursor:pointer;

}



table{

    width:95%;
    margin:auto;
    border-collapse:collapse;

}


th{

    background:#0066cc;
    color:white;

}


td,th{

    border:1px solid #ccc;
    padding:10px;
    text-align:center;

}



@media print{

    .report-filter,
    .report-buttons{

        display:none;

    }

}



</style>


</head>


<body>


<h1 style="text-align:center">
تقرير القيم المنصرفة
</h1>



<div class="report-filter">


<div>

<label>
من تاريخ
</label>

<input type="date" id="fromDate">

</div>



<div>

<label>
إلى تاريخ
</label>

<input type="date" id="toDate">

</div>



<div>

<label>
الفرع
</label>


<select id="branch">

<option value="ALL">
كل الفروع
</option>

</select>


</div>



<button onclick="loadReport()">

عرض التقرير

</button>


</div>




<div class="dashboard">


<div class="card">

<h3>
إجمالي المنصرف
</h3>

<span id="total">
0
</span>

</div>



<div class="card">

<h3>
عدد العمليات
</h3>

<span id="count">
0
</span>

</div>


</div>





<div class="report-buttons">

<button onclick="window.print()">
🖨 طباعة
</button>


<button onclick="exportExcel()">
📊 تصدير Excel
</button>


</div>





<table>


<thead>

<tr>

<th>
م
</th>


<th>
الفرع
</th>


<th>
المحطة
</th>


<th>
الإجراء التصحيحي
</th>


<th>
القيمة المنصرفة
</th>


</tr>

</thead>



<tbody id="reportBody">


</tbody>



</table>





<script>


const scriptURL =
"https://script.google.com/macros/s/AKfycbytRhNKLLSNVRiqUAQ17D5Jc4VBcFWGcFHgYwfK4DGAhuI0h_EtltmbZ2n9Am9CB1m1xg/exec";




let reportData=[];




window.onload=function(){

    loadBranches();

};





function loadBranches(){


fetch(
scriptURL+
"?action=getStations&branch="
)


.then(r=>r.json())

.then(data=>{


});



}




function loadReport(){


let from =
document.getElementById("fromDate").value;


let to =
document.getElementById("toDate").value;


let branch =
document.getElementById("branch").value;



if(!from || !to){

alert("اختر الفترة الزمنية");

return;

}




fetch(
scriptURL+
"?action=getFinancialReport"+
"&from="+from+
"&to="+to+
"&branch="+encodeURIComponent(branch)

)


.then(r=>r.json())

.then(data=>{


if(data.status!=="success"){

alert("حدث خطأ");

return;

}



document.getElementById("total").innerHTML =
Number(data.total).toLocaleString();



document.getElementById("count").innerHTML =
data.count;



reportData=data.rows;


let tbody =
document.getElementById("reportBody");


tbody.innerHTML="";



data.rows.forEach((r,i)=>{


tbody.innerHTML +=

`
<tr>

<td>${i+1}</td>

<td>${r.branch}</td>

<td>${r.station}</td>

<td>${r.corraction}</td>

<td>${Number(r.expense).toLocaleString()}</td>

</tr>
`;


});



});


}





function exportExcel(){


let csv =
"الفرع,المحطة,الإجراء التصحيحي,القيمة المنصرفة\n";



reportData.forEach(r=>{


csv +=
`${r.branch},${r.station},${r.corraction},${r.expense}\n`;


});



let blob =
new Blob(
[csv],
{
type:"text/csv;charset=utf-8;"
}
);



let link =
document.createElement("a");


link.href =
URL.createObjectURL(blob);


link.download =
"financial_report.csv";


link.click();


}



</script>


</body>

</html>

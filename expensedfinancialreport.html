<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Expensed Financial Report</title>
<link rel="stylesheet" href="expensedfinancialreport.css">

</head>


<body>
<h1 style="text-align:center">
تقرير القيم المنصرفة
</h1>

<div class="report-filter">
    <div>
        <label>From</label>
        <input type="date" id="fromDate">
    </div>
    <div>
        <label>To</label>
        <input type="date" id="toDate">
    </div>
    <div>
        <label>Branch</label>
        <select id="branch">
            <option value="ALL">All</option>
            <option value="العدوه">العدوه</option>
            <option value="مغاغة">مغاغة</option>
            <option value="بنى مزار">بنى مزار</option>
            <option value="مطاى">مطاى</option>
            <option value="سمالوط">سمالوط</option>
            <option value="المنيا">المنيا</option>
            <option value="ابوقرقاص">ابوقرقاص</option>
            <option value="ملوى">ملوى</option>
            <option value="ديرمواس">ديرمواس</option>
        </select>
    </div>

    <button onclick="loadReport()">Report</button>
</div>

<div class="dashboard">
    <div class="card">
        <h3>(ج.م)إجمالي المنصرف</h3>
        <span id="total">0</span>
    </div>
    <div class="card">
        <h3>عدد الاجراءات المنفذه</h3>
        <span id="count">0</span>
    </div>
</div>

<div class="report-buttons">
    <button onclick="window.print()">🖨 Print</button>
    <button onclick="exportExcel()">Export</button>
</div>

<table>
<thead>
<tr>
<th>م</th>
<th>الفرع</th>
<th>المحطة</th>
<th>الإجراء التصحيحي</th>
<th>القيمة المنصرفة</th>
</tr>
</thead>

<tbody id="reportBody">
</tbody>
</table>
<script>


const scriptURL = "https://script.google.com/macros/s/AKfycbwriKdbmI9Tx7_sT1lpcDI9MQvY6Y4GtCvpRroThLZ2-YUTILElbYXZ4Qr7A6-eOdxDiw/exec";

let reportData=[];

window.onload=function(){
    loadBranches();
};


function loadBranches(){

fetch(
scriptURL+
"?action=getStations&branch="
)
.then(r=>r.json())
.then(data=>{
});
}


function loadReport(){

let from = document.getElementById("fromDate").value;
let to = document.getElementById("toDate").value;
let branch = document.getElementById("branch").value;

if(!from || !to){
    alert("اختر الفترة الزمنية");
    return;
}

fetch(
scriptURL+
"?action=getFinancialReport"+
"&from="+from+
"&to="+to+
"&branch="+encodeURIComponent(branch)
)
.then(r=>r.json())
.then(data=>{


if(data.status!=="success"){
    alert("حدث خطأ");
    return;
}

document.getElementById("total").innerHTML = Number(data.total).toLocaleString();
document.getElementById("count").innerHTML = data.count;
reportData=data.rows;
let tbody = document.getElementById("reportBody");

tbody.innerHTML="";
data.rows.forEach((r,i)=>{
tbody.innerHTML +=
`
<tr>

<td>${i+1}</td>
<td>${r.branch}</td>
<td>${r.station}</td>
<td>${r.corraction}</td>
<td>${Number(r.expense).toLocaleString()}</td>

</tr>
`;

});
});
}


function exportExcel(){

    let csv = "الفرع,المحطة,الإجراء التصحيحي,القيمة المنصرفة\n";
    reportData.forEach(r=>{
    csv +=
    `${r.branch},${r.station},${r.corraction},${r.expense}\n`;
    });
    
    
    let blob = new Blob([csv],{
    type:"text/csv;charset=utf-8;"
    }
    );
    
    let link = document.createElement("a");
    
    link.href = URL.createObjectURL(blob);
    
    link.download = "financial_report.csv";
    
    link.click();
}



</script>


</body>

</html>
